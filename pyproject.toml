[project]
name = "fusion-mcp"
version = "0.1.0"
description = "MCP server that lets LLM agents build parametric models in Autodesk Fusion 360"
requires-python = ">=3.11"
dependencies = ["mcp"]

[project.scripts]
fusion-mcp = "fusion_mcp.cli:main"

[dependency-groups]
dev = ["ruff", "mypy", "pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fusion_mcp"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["build"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
# `mypy .` runs from mcp-plugin/: src-layout package + adsk stubs resolve via mypy_path,
# tests and fusion_addin get dotted names relative to mcp-plugin/.
mypy_path = "src,tests/stubs"
explicit_package_bases = true
exclude = ['^\.venv/', '^build/', '^tests/stubs/']

[[tool.mypy.overrides]]
module = ["fusion_addin", "fusion_addin.*", "tests", "tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
disallow_untyped_decorators = false
disallow_any_generics = false
warn_return_any = false

[[tool.mypy.overrides]]
module = ["adsk", "adsk.*"]
ignore_missing_imports = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
warn_return_any = false

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["fusion: requires a running Fusion 360 with the add-in loaded"]
# Smoke tests on a live Fusion run only on request: `pytest -m fusion`.
addopts = ["-m", "not fusion"]
